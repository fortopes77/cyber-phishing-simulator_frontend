server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html — always check with the server for the latest version
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # JS/CSS/etc have content hashes in their filenames (e.g. main.a1b2c3.js),
    # so if the filename changes, it's already a new URL — safe to cache hard
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}