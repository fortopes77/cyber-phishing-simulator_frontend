<app-modal
  [isOpen]="isOpen"
  title="Confirm deletion"
  (closed)="onCancel()"
>
  <p>{{ message }} {{ title }}?</p>
  <div modal-footer class="modal-actions">
    <button type="button" class="btn btn-secondary" (click)="onCancel()">
      {{ cancelLabel }}
    </button>
    <button type="button" class="btn btn-danger" (click)="onConfirm()">
      {{ confirmLabel }}
    </button>
  </div>
</app-modal>
