<app-modal [isOpen]="isOpen" title="Send password reset email" (closed)="onCancel()">
  <p>Send {{ targetName }} an email with a link to reset their password?</p>
  @if (error) {
    <p class="form-error">{{ error }}</p>
  }
  <div modal-footer class="modal-actions">
    <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="button" class="btn btn-primary" [disabled]="loading" (click)="onConfirm()">
      {{ loading ? 'Sending...' : 'Send email' }}
    </button>
  </div>
</app-modal>
