<div class="dashboard-card">
  @if (title || description) {
    <div [ngClass]="{ 'dashboard-card__header': title || description }">
      <div>
        <h2>{{ title }}</h2>
        <p>{{ description }}</p>
      </div>

      @if (showAction) {
        <button class="dashboard-card__action" (click)="onActionClick()">
          {{ actionText }}
          <span>→</span>
        </button>
      }
    </div>
  }

  <div class="dashboard-card__content">
    <ng-content></ng-content>
  </div>
</div>
