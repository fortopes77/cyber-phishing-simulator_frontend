<div class="dashboard-card">
  <div class="dashboard-card__header">
    <div>
      <h2>{{ title }}</h2>
      <p>{{ description }}</p>
    </div>

    @if (showAction) {
      <button class="dashboard-card__action" (click)="onActionClick()">
        {{ actionText }}
        <span>→</span>
      </button>
    }
  </div>

  <div class="dashboard-card__content">
    <ng-content></ng-content>
  </div>
</div>
