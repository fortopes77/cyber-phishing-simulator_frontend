<app-modal [isOpen]="isOpen" [title]="title" (closed)="onCancel()">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="reset-password-form">
    @if (error) {
      <p class="form-error">{{ error }}</p>
    }

    <label class="field">
      <span>New password</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
      <app-form-field-error
        [control]="form.get('newPassword')"
        label="New password"
      ></app-form-field-error>
    </label>

    <label class="field">
      <span>Confirm new password</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      <app-form-field-error
        [control]="form.get('confirmPassword')"
        label="Confirm password"
      ></app-form-field-error>
      @if (form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched) {
        <p class="field-error">Passwords don't match.</p>
      }
    </label>

    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Resetting...' : 'Reset password' }}
      </button>
    </div>
  </form>
</app-modal>
