<div class="date-range-picker">
  <button
    #trigger
    type="button"
    class="trigger"
    [class.has-selection]="hasSelection"
    (click)="toggle(trigger)"
    [attr.aria-expanded]="isOpen"
  >
    <span>{{ triggerLabel }}</span>
    <span class="trigger-caret">▾</span>
  </button>
</div>

<ng-template #panelTemplate>
  <div class="date-range-panel" role="dialog" aria-label="Date range filter">
    <div class="presets">
      @for (preset of presets; track preset.label) {
        <button type="button" class="preset-button" (click)="applyPreset(preset)">
          {{ preset.label }}
        </button>
      }
    </div>

    <div class="custom-range">
      <label class="date-field">
        <span>Start</span>
        <input type="date" [(ngModel)]="draftStart" />
      </label>
      <label class="date-field">
        <span>End</span>
        <input type="date" [(ngModel)]="draftEnd" />
      </label>
    </div>

    <div class="panel-actions">
      <button type="button" class="btn btn-secondary" (click)="clear()">Clear</button>
      <button type="button" class="btn btn-primary" (click)="applyDraft()">Apply</button>
    </div>
  </div>
</ng-template>
