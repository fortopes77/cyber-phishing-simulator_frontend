<aside class="sidebar" [class.hidden]="sidebarHidden">
  <div class="sidebar-header">
    <div class="brand">
      <img src="assets/phish-logo-long.png" alt="Phish logo" />
    </div>
  </div>

  <nav class="sidebar-nav">
    @if (isStaff) {
      <ul>
        @if (currentUser?.role === "admin") {
          <li>
            <fa-icon [icon]="fontAwesomeIcons.buildingIcon"></fa-icon>
            <a routerLink="/admin/organisations" routerLinkActive="active"
              >Organisations</a
            >
          </li>
        }
        <li>
          <fa-icon [icon]="fontAwesomeIcons.progressBarsIcon"></fa-icon>
          <a routerLink="/trainer/dashboard" routerLinkActive="active"
            >Dashboard</a
          >
        </li>
        <li>
          <fa-icon [icon]="fontAwesomeIcons.userIcon"></fa-icon>
          <a routerLink="/trainer/learners" routerLinkActive="active"
            >Learners</a
          >
        </li>
        <li>
          <fa-icon [icon]="fontAwesomeIcons.userGroupIcon"></fa-icon>
          <a routerLink="/trainer/trainers" routerLinkActive="active"
            >Trainers</a
          >
        </li>
        <li>
          <fa-icon [icon]="fontAwesomeIcons.openBookIcon"></fa-icon>
          <a routerLink="/trainer/modules" routerLinkActive="active">Modules</a>
        </li>
        <li>
          <fa-icon [icon]="fontAwesomeIcons.groupLayerIcon"></fa-icon>
          <a routerLink="/trainer/scenarios" routerLinkActive="active"
            >Scenario Library</a
          >
        </li>
        <li>
          <fa-icon [icon]="fontAwesomeIcons.chartColumnIcon"></fa-icon>
          <a routerLink="/trainer/analytics" routerLinkActive="active"
            >Reports & Analytics</a
          >
        </li>
      </ul>
    } @else {
      <ul>
        <li class="nav-item">
          <fa-icon [icon]="fontAwesomeIcons.progressBarsIcon"></fa-icon>
          <a routerLink="/learner/dashboard" routerLinkActive="active"
            >Dashboard</a
          >
        </li>
        <li class="nav-item">
          <fa-icon [icon]="fontAwesomeIcons.groupLayerIcon"></fa-icon>
          <a routerLink="/learner/modules" routerLinkActive="active"
            >My Modules</a
          >
        </li>
        <li class="nav-item">
          <fa-icon [icon]="fontAwesomeIcons.awardIcon"></fa-icon>
          <a routerLink="/learner/results" routerLinkActive="active">Results</a>
        </li>
        <li class="nav-item">
          <fa-icon [icon]="fontAwesomeIcons.chartColumnIcon"></fa-icon>
          <a routerLink="/learner/progress" routerLinkActive="active"
            >My Progress</a
          >
        </li>
      </ul>
    }
  </nav>

  <div class="sidebar-footer">
    <button
      type="button"
      class="profile-card profile-toggle"
      (click)="openProfileModal()"
    >
      <div class="avatar">
        <fa-icon [icon]="fontAwesomeIcons.userIcon"></fa-icon>
      </div>
      <div class="profile-info">
        <div class="profile-name">
          {{ fullName || currentUser?.email || "Your account" }}
        </div>
        <div class="profile-email">{{ currentUser?.email }}</div>
      </div>
    </button>

    <button type="button" class="profile-action sign-out" (click)="logout()">
      <fa-icon [icon]="fontAwesomeIcons.arrowRightIcon"></fa-icon>
      <span>Sign out</span>
    </button>
  </div>
</aside>

<app-sign-out-confirmation-modal
  [isOpen]="signOutModalOpen"
  (confirmed)="confirmSignOut()"
  (cancelled)="cancelSignOut()"
></app-sign-out-confirmation-modal>

<app-profile-modal
  [isOpen]="profileModalOpen"
  [user]="currentUser ?? null"
  [profileSaving]="profileSaving"
  [profileError]="profileError"
  [profileSaved]="profileSaved"
  [passwordSaving]="passwordSaving"
  [passwordError]="passwordError"
  [passwordSaved]="passwordSaved"
  (closed)="closeProfileModal()"
  (profileSubmitted)="saveProfile($event)"
  (passwordSubmitted)="savePassword($event)"
></app-profile-modal>
