<div class="dashboard-container">
  <app-header
    title="Dashboard"
    subtitle="Monitor learner progress and manage training modules"
  ></app-header>

  @if (dashboardError) {
    <p class="dashboard-error">
      Couldn't load the latest dashboard data - showing what's available.
    </p>
  }

  <div class="dashboard-statistics">
    <app-data-card
      label="Total Learners"
      [statistic]="{ singleValue: totalLearners }"
      [icon]="fontAwesomeIcons.userGroupIcon"
      dataType="total"
      />
      <app-data-card
        label="Active Modules"
        [statistic]="{ singleValue: activeModules }"
        [icon]="fontAwesomeIcons.openBookIcon"
        dataType="module"
        /><app-data-card
        label="Completion Rate"
        [statistic]="{ percentage: completionRate }"
        [icon]="fontAwesomeIcons.targetIcon"
        dataType="scenario"
        /><app-data-card
        label="Average Score"
        [statistic]="{ percentage: averageScore }"
        [icon]="fontAwesomeIcons.trendUpIcon"
        dataType="average"
        />
      </div>
      <div class="completion-activity-section">
        <div class="completion-overview">
          <app-dashboard-card
            title="Completion Overview"
            description="Completion rates by training module"
            actionText="View Details"
            (actionClick)="viewModuleDetails()"
            >
            @for (module of moduleCompletion; track module.moduleName) {
              <app-progress-row
                [label]="module.moduleName"
                [value]="module.completionPercentage"
              ></app-progress-row>
            } @empty {
              <p class="empty-state">No module completion data yet.</p>
            }
          </app-dashboard-card>
        </div>
        <div class="recent-activity">
          <app-dashboard-card
            title="Recent Activity"
            description="Latest learner actions"
            actionText="View More"
            >
            <app-activity-list [items]="activities"></app-activity-list>
          </app-dashboard-card>
        </div>
      </div>
      <div class="action-card-section">
        <app-action-card
          title="Manage Learners"
          [icon]="fontAwesomeIcons.userGroupIcon"
          (click)="manageLearners()"
        ></app-action-card>

        <app-action-card
          title="Active Modules"
          [icon]="fontAwesomeIcons.openBookIcon"
          (click)="viewActiveModules()"
        ></app-action-card>

        <app-action-card
          title="View Reports"
          [icon]="fontAwesomeIcons.targetIcon"
          (click)="viewReports()"
        ></app-action-card>
      </div>
    </div>
