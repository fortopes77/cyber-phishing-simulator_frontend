<app-header
  [title]="isCreateMode ? 'Create Scenario' : 'Edit Scenario'"
  [subtitle]="
    isCreateMode
      ? 'Create a new scenario below.'
      : 'Update the scenario details below and save your changes.'
  "
></app-header>
<app-dashboard-card>
  <form
    class="scenario-form"
    [formGroup]="scenarioForm"
    (ngSubmit)="onSubmit()"
  >
    <div class="editor-layout">
      <div class="form-panel">
        <div class="form-grid">
          <label class="field">
            <span>Module</span>
            <select formControlName="moduleId">
              <option value="" disabled>Select a module</option>
              @for (option of moduleOptions; track option) {
                <option [value]="option">
                  {{ option }}
                </option>
              }
            </select>
          </label>

          <label class="field">
            <span>Title</span>
            <input
              type="text"
              formControlName="title"
              placeholder="Enter scenario title"
            />
          </label>

          <label class="field field-full">
            <span>Content</span>
            <textarea
              rows="4"
              formControlName="content"
              placeholder="Enter the scenario content"
            ></textarea>
          </label>

          <label class="field">
            <span>Category</span>
            <select formControlName="category">
              <option value="" disabled>Select a category</option>
              @for (option of categoryOptions; track option.value) {
                <option [value]="option.value">
                  {{ option.label }}
                </option>
              }
            </select>
          </label>

          <label class="field">
            <span>Difficulty</span>
            <select formControlName="difficulty">
              <option value="" disabled>Select a difficulty</option>
              @for (option of difficultyOptions; track option.value) {
                <option [value]="option.value">
                  {{ option.label }}
                </option>
              }
            </select>
          </label>

          <label class="field">
            <span>Interaction type</span>
            <select formControlName="interactionType">
              <option value="" disabled>Select interaction type</option>
              @for (option of interactionTypeOptions; track option.value) {
                <option [value]="option.value">
                  {{ option.label }}
                </option>
              }
            </select>
          </label>

          <label class="field field-full">
            <span>Scenario description</span>
            <textarea
              rows="4"
              formControlName="scenarioDescription"
              placeholder="Describe the scenario"
            ></textarea>
          </label>

          <div class="field field-full">
            <span>Answer type</span>
            <div class="answer-mode-toggle">
              <label class="radio-option">
                <input type="radio" formControlName="answerMode" value="simple" />
                Simple (single correct answer)
              </label>
              <label class="radio-option">
                <input
                  type="radio"
                  formControlName="answerMode"
                  value="detailed"
                />
                Detailed (correct cue phrases)
              </label>
            </div>
          </div>

          @if (answerMode === 'simple') {
            <label class="field field-full">
              <span>Correct answer</span>
              <input
                type="text"
                formControlName="correctAnswer"
                placeholder="e.g. suspicious"
              />
            </label>
          } @else {
            <div class="field field-full">
              <span>Correct cue phrases</span>
              <div class="cue-list" formArrayName="correctCues">
                @for (cue of correctCuesArray.controls; track $index) {
                  <div class="cue-row">
                    <input
                      type="text"
                      [formControlName]="$index"
                      placeholder="Phrase learners should flag as suspicious"
                    />
                    <button
                      type="button"
                      class="btn btn-secondary"
                      (click)="removeCue($index)"
                    >
                      Remove
                    </button>
                  </div>
                }
              </div>
              <button type="button" class="btn btn-secondary" (click)="addCue()">
                Add cue
              </button>
            </div>
          }
        </div>

        <div class="actions">
          <button type="button" class="btn btn-secondary" (click)="onCancel()">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </div>

      <aside class="preview-panel">
        <div class="preview-header">
          <div>
            <h2>Live Preview</h2>
            <p>See how this scenario will appear on the scenario page.</p>
          </div>
          <span class="preview-tag">Scenario Page</span>
        </div>

        <div class="preview-card">
          <app-scenario-page
            [previewMode]="true"
            [previewData]="previewScenarioData"
            [moduleTitle]="previewModuleTitle"
          ></app-scenario-page>
        </div>
      </aside>
    </div>

    <!-- TODO Implement save confirmation message -->
  </form>
</app-dashboard-card>
