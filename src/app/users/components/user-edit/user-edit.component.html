<app-header
  [title]="isCreateMode ? (managingRole === 'trainer' ? 'Add Trainer' : 'Add Learner') : 'Edit Learner'"
  [subtitle]="
    isCreateMode
      ? (managingRole === 'trainer'
          ? 'Create a new trainer account.'
          : 'Create a new learner account.')
      : 'Update the account details below and save your changes.'
  "
></app-header>

<app-dashboard-card>
  @if (error) {
    <p class="user-edit-error">Couldn't save this account - {{ error }}</p>
  }

  <form class="user-form" [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <label class="field">
        <span>Username</span>
        <input
          type="text"
          formControlName="username"
          placeholder="Enter username"
        />
        @if (!isCreateMode) {
          <small class="field-hint">Username can't be changed.</small>
        }
        <app-form-field-error
          [control]="userForm.get('username')"
          label="Username"
        ></app-form-field-error>
      </label>

      <label class="field">
        <span>First name</span>
        <input
          type="text"
          formControlName="firstName"
          placeholder="Enter first name"
        />
        <app-form-field-error
          [control]="userForm.get('firstName')"
          label="First name"
        ></app-form-field-error>
      </label>

      <label class="field">
        <span>Last name</span>
        <input
          type="text"
          formControlName="lastName"
          placeholder="Enter last name"
        />
        <app-form-field-error
          [control]="userForm.get('lastName')"
          label="Last name"
        ></app-form-field-error>
      </label>

      <label class="field">
        <span>Email</span>
        <input
          type="email"
          formControlName="email"
          placeholder="name@example.com"
        />
        <app-form-field-error
          [control]="userForm.get('email')"
          label="Email"
        ></app-form-field-error>
      </label>

      <label class="field">
        <span>{{ isCreateMode ? 'Password' : 'New password' }}</span>
        <input
          type="password"
          formControlName="password"
          placeholder="Enter password"
          autocomplete="new-password"
        />
        @if (!isCreateMode) {
          <small class="field-hint">Leave blank to keep the current password.</small>
        }
        <app-form-field-error
          [control]="userForm.get('password')"
          label="Password"
        ></app-form-field-error>
      </label>

      @if (isCreateMode && isGlobalAdmin) {
        <label class="field">
          <span>Organisation</span>
          <select formControlName="organisationId">
            <option [ngValue]="null" disabled>Select an organisation</option>
            @for (organisation of organisations; track organisation.id) {
              <option [ngValue]="organisation.id">{{ organisation.name }}</option>
            }
          </select>
          <app-form-field-error
            [control]="userForm.get('organisationId')"
            label="Organisation"
          ></app-form-field-error>
        </label>
      }

      <label class="field">
        <span>Role</span>
        <select formControlName="role">
          @for (option of roleOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        @if (!isCreateMode) {
          <small class="field-hint">Role can't be changed.</small>
        } @else {
          <small class="field-hint">
            {{
              managingRole === 'trainer'
                ? "Creating from the Trainers screen always creates a trainer."
                : "Creating from the Learners screen always creates a learner."
            }}
          </small>
        }
        <app-form-field-error
          [control]="userForm.get('role')"
          label="Role"
        ></app-form-field-error>
      </label>
    </div>

    <div class="actions">
      @if (!isCreateMode) {
        <button
          type="button"
          class="btn btn-secondary"
          (click)="openForgotPasswordModal()"
        >
          Send Password Reset Email
        </button>
      }
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Cancel
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        Save
      </button>
    </div>
  </form>
</app-dashboard-card>

<app-forgot-password-modal
  [isOpen]="isForgotPasswordModalOpen"
  [targetName]="fullNameValue || 'this account'"
  [loading]="forgotPasswordSending"
  [error]="forgotPasswordError"
  (confirmed)="confirmForgotPassword()"
  (cancelled)="cancelForgotPassword()"
></app-forgot-password-modal>
