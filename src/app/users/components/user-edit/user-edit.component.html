<app-header
  [title]="isCreateMode ? 'Add Learner' : 'Edit Learner'"
  [subtitle]="
    isCreateMode
      ? 'Create a new learner or trainer account.'
      : 'Update the account details below and save your changes.'
  "
></app-header>

<app-dashboard-card>
  @if (error) {
    <p class="user-edit-error">Couldn't save this account - {{ error }}</p>
  }

  <form class="user-form" [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <label class="field">
        <span>Username</span>
        <input
          type="text"
          formControlName="username"
          placeholder="Enter username"
        />
        @if (!isCreateMode) {
          <small class="field-hint">Username can't be changed.</small>
        }
        <app-form-field-error
          [control]="userForm.get('username')"
          label="Username"
        ></app-form-field-error>
      </label>

      <label class="field">
        <span>First name</span>
        <input
          type="text"
          formControlName="firstName"
          placeholder="Enter first name"
        />
        <app-form-field-error
          [control]="userForm.get('firstName')"
          label="First name"
        ></app-form-field-error>
      </label>

      <label class="field">
        <span>Last name</span>
        <input
          type="text"
          formControlName="lastName"
          placeholder="Enter last name"
        />
        <app-form-field-error
          [control]="userForm.get('lastName')"
          label="Last name"
        ></app-form-field-error>
      </label>

      <label class="field">
        <span>Email</span>
        <input
          type="email"
          formControlName="email"
          placeholder="name@example.com"
        />
        <app-form-field-error
          [control]="userForm.get('email')"
          label="Email"
        ></app-form-field-error>
      </label>

      <label class="field">
        <span>{{ isCreateMode ? 'Password' : 'New password' }}</span>
        <input
          type="password"
          formControlName="password"
          placeholder="Enter password"
          autocomplete="new-password"
        />
        @if (!isCreateMode) {
          <small class="field-hint">Leave blank to keep the current password.</small>
        }
        <app-form-field-error
          [control]="userForm.get('password')"
          label="Password"
        ></app-form-field-error>
      </label>

      <label class="field">
        <span>Role</span>
        <select formControlName="role">
          @for (option of roleOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        @if (!isCreateMode) {
          <small class="field-hint">Role can't be changed.</small>
        }
        <app-form-field-error
          [control]="userForm.get('role')"
          label="Role"
        ></app-form-field-error>
      </label>
    </div>

    <div class="actions">
      @if (!isCreateMode) {
        <button
          type="button"
          class="btn btn-secondary"
          (click)="openForgotPasswordModal()"
        >
          Send Password Reset Email
        </button>
      }
      @if (!isCreateMode && isLearner) {
        <button
          type="button"
          class="btn btn-secondary"
          (click)="openSendReminderModal()"
        >
          Send Reminder Email
        </button>
      }
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Cancel
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        Save
      </button>
    </div>
  </form>
</app-dashboard-card>

<app-send-reminder-modal
  [isOpen]="isSendReminderModalOpen"
  [learnerName]="fullNameValue || 'this learner'"
  [loading]="reminderSending"
  [error]="reminderError"
  (confirmed)="confirmSendReminder()"
  (cancelled)="cancelSendReminder()"
></app-send-reminder-modal>

<app-forgot-password-modal
  [isOpen]="isForgotPasswordModalOpen"
  [targetName]="fullNameValue || 'this account'"
  [loading]="forgotPasswordSending"
  [error]="forgotPasswordError"
  (confirmed)="confirmForgotPassword()"
  (cancelled)="cancelForgotPassword()"
></app-forgot-password-modal>
