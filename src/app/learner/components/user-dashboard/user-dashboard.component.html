<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Welcome back, {{ currentUser?.username }}</h1>
    <p class="dashboard-intro">
      Continue your security awareness training by selecting a scenario from the
      library, or review your past results to see how you're progressing.
    </p>
  </div>

  <div class="dashboard-wrapper">
    <div class="dashboard-content">
      <app-data-card
        [icon]="fontAwesomeIcon.openBookIcon"
        label="Modules Completed"
        [statistic]="{ topValue: stats.modulesCompleted, bottomValue: stats.totalModules }"
        dataType="module"
      >
      </app-data-card>

      <app-data-card
        [icon]="fontAwesomeIcon.targetIcon"
        label="Scenarios Completed"
        [statistic]="{ topValue: stats.scenariosCompleted, bottomValue: stats.totalScenarios }"
        dataType="scenario"
      >
      </app-data-card>

      <app-data-card
        [icon]="fontAwesomeIcon.awardIcon"
        label="Average Score"
        [statistic]="{ percentage: stats.averageScore }"
        dataType="average"
      >
      </app-data-card>
    </div>

    <div *ngIf="continueLearning">
      <app-dashboard-card
        title="Continue Learning"
        description="Pick up where you left off"
        actionText="View All"
      >
        <app-learning-progress-card [item]="continueLearning">
        </app-learning-progress-card>
      </app-dashboard-card>
    </div>

    <div>
      <app-dashboard-card>
        <app-header
          title="Assigned Modules"
          subtitle="Your training curriculum"
        ></app-header>

        <div class="assigned-modules-grid">
          <app-assigned-module-card
            *ngFor="let module of assignedModules"
            [module]="module"
            (selected)="onAssignedModuleSelected($event)"
          ></app-assigned-module-card>
        </div>
      </app-dashboard-card>
    </div>
  </div>
</div>
