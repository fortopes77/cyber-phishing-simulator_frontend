<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Welcome back, {{ currentUser?.firstName || currentUser?.username }}</h1>
    <p class="dashboard-intro">Continue your security awareness training</p>
  </div>

  <div class="dashboard-wrapper">
    <div class="dashboard-content">
      <app-data-card
        [icon]="fontAwesomeIcon.openBookIcon"
        label="Modules Completed"
        [statistic]="{ topValue: stats.modulesCompleted, bottomValue: stats.totalModules }"
        dataType="module"
      >
      </app-data-card>

      <app-data-card
        [icon]="fontAwesomeIcon.targetIcon"
        label="Scenarios Cleared"
        [statistic]="{ topValue: stats.scenariosCompleted, bottomValue: stats.totalScenarios }"
        dataType="scenario"
      >
      </app-data-card>

      <app-data-card
        [icon]="fontAwesomeIcon.awardIcon"
        label="Average Score"
        [statistic]="{ percentage: stats.averageScore }"
        dataType="average"
      >
      </app-data-card>
    </div>

    @if (continueLearning) {
      <div>
        <app-dashboard-card
          title="Continue Learning"
          description="Pick up where you left off"
          actionText="View All"
          (actionClick)="viewAllModules()"
        >
          <app-learning-progress-card [item]="continueLearning">
          </app-learning-progress-card>
        </app-dashboard-card>
      </div>
    }

    <div>
      <app-dashboard-card>
        <app-header
          title="Assigned Modules"
          subtitle="Your training curriculum"
        ></app-header>

        @if (assignedModules.length) {
          <div class="assigned-modules-grid">
            @for (module of assignedModules; track module.id) {
              <app-assigned-module-card
                [module]="module"
                (selected)="onAssignedModuleSelected($event)"
              ></app-assigned-module-card>
            }
          </div>
        } @else {
          <p class="empty-state">
            No modules assigned, please contact your trainer.
          </p>
        }
      </app-dashboard-card>
    </div>
  </div>
</div>
